name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, typecheck, unit tests, architecture
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Format
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Architecture rules
        run: npm run arch

      - name: Compose files are valid
        run: |
          docker compose config --quiet
          docker compose -f docker-compose.yml -f docker-compose.test.yml config --quiet

  database:
    name: Isolation and integration tests (MongoDB, Redis)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      MONGODB_URI: mongodb://127.0.0.1:27017/?directConnection=true
      REDIS_URL: redis://127.0.0.1:6379
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Start MongoDB (atlas-local) and Redis
        run: docker compose -f docker-compose.yml -f docker-compose.test.yml up -d --wait --wait-timeout 240 mongo redis

      - run: npm ci

      - name: Isolation tests
        run: npm run test:isolation

      - name: Integration tests
        run: npm run test:integration

      - name: MongoDB and Redis logs on failure
        if: failure()
        run: docker compose logs mongo redis --tail 200
